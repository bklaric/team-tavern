# The Node and npm the site is built, run and tested with. The containers in stacks/ pin the same
# Node in their images.
[tools]
node = "24.21.0"
npm = "12.0.2"

# The spago, purs, esbuild, sass and Playwright that package.json pins, ahead of any installed
# globally.
[env]
_.path = ["{{config_root}}/node_modules/.bin"]
