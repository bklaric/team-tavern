<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Social media and SEO meta. -->
  <link id="canonical-url" rel="canonical" href="https://www.teamtavern.net/">
  <link id="hreflang-en" rel="alternate" hreflang="en" href="https://www.teamtavern.net/">

  <meta id="meta-twitter-card" name="twitter:card" content="summary">
  <meta id="meta-twitter-site" name="twitter:site" content="@TeamTavernNet">
  <meta id="meta-twitter-title" name="twitter:title" content="TeamTavern: find players, groups and communities">
  <meta id="meta-twitter-description" name="twitter:description" content="Find players, groups and communities for the games you play. Post once, and we'll tell you when someone new fits.">
  <meta id="meta-twitter-image" name="twitter:image" content="https://www.teamtavern.net/logo-512.png">
  <meta id="meta-twitter-image-alt" name="twitter:image:alt" content="TeamTavern logo">
  <meta id="meta-og-title" property="og:title" content="TeamTavern: find players, groups and communities">

  <!-- Icons. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/logo-512.png">

  <!-- Resources preload. -->
  <link rel="preload" href="/app.min.js" as="script">
  <link rel="preload" href="/style.min.css" as="style">
  <link rel="preload" href="/fonts/inter.css" as="style">
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Venatus -->
  <script src="https://hb.vntsm.com/v4/live/vms/sites/teamtavern.net/index.js" async></script>
  <script>
    self.__VM = self.__VM || [];
    self.__VM.push(function (admanager, scope) {
      // Google shows the interstitial on the first link click after it loads,
      // so it is held back until the player has navigated once.
      scope.Config.autoPlacements('interstitial').remove();
      var interstitialAdded = false;
      scope.Instances.pageManager.on('navigated', () => {
        scope.Instances.pageManager.newPageSession(false);
        if (!interstitialAdded) {
          interstitialAdded = true;
          scope.Config.get('interstitial').displayBody();
        }
      }, false);
    });
  </script>

  <!-- Styles. -->
  <link rel="stylesheet" href="/fonts/inter.css">
  <link rel="stylesheet" href="/style.min.css">

  <!-- The app. -->
  <script async src="/app.min.js"></script>
</head>

<body>
  <div id="spa-teamtavern"></div>
</body>

</html>
