services:
  postgres:
    image: postgres:14.4
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${POSTGRES_DOCKER_PATH}:/var/lib/postgresql/data
      - ${POSTGRES_BACKUP_PATH}:/backups

  node:
    # Keep in step with the Volta pin in package.json.
    image: node:24.21.0
    container_name: node
    restart: unless-stopped
    # Bash -c is necessary because of cd and &&, which are shell builtin commands.
    # --omit=dev: server.js bundles everything except bcrypt, pg and
    # @sendgrid/mail, so the build toolchain has no place in this container.
    command: >
      bash -c "cd /root/team-tavern/dist-server &&
              npm ci --omit=dev &&
              node server.js"
    env_file: .env
    volumes:
      - ${TEAMTAVERN_PATH}/dist-server:/root/team-tavern/dist-server
      - node_modules:/root/team-tavern/dist-server/node_modules
    depends_on:
      - postgres

  renderready:
    # No published image, so the first `up` builds it from the tag.
    build: https://github.com/lukapozega/renderready.git#v1.0.0
    container_name: renderready
    restart: unless-stopped
    environment:
      # Without it, renderready fetches the page itself and hands it to Chromium, which then
      # treats the page as public and blocks its scripts from reaching the private `caddy`
      # address. No render needs a redirect followed: every page path answers 200.
      FOLLOW_REDIRECTS: "true"
      # Matches subdomains too, so www and staging render.
      ALLOWED_DOMAINS: caddy,teamtavern.net
    depends_on:
      - node

  caddy:
    image: caddy:2.10.0
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${TEAMTAVERN_PATH}/stacks/base.Caddyfile:/etc/caddy/base.Caddyfile
      - ${TEAMTAVERN_PATH}/stacks/${ENVIRONMENT}.Caddyfile:/etc/caddy/Caddyfile
      - ${TEAMTAVERN_PATH}/dist-client:/srv
      - ${CADDY_DOCKER_PATH}/data:/data
      - ${CADDY_DOCKER_PATH}/config:/config
    depends_on:
      - node
      - renderready

# Named volume for API's node_modules directory.
# We're using this because we don't want to see container's node_modules on the host.
volumes:
  node_modules:
