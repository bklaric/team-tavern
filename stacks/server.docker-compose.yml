# The stack a staging or production server runs. bundle.ps1 copies this file
# into dist/<environment>/ as docker-compose.yml, beside the client, the server
# and the Caddyfiles it mounts, and deploy.ps1 unpacks that on the server as
# ~/team-tavern/releases/<id>/. So ./ below is the release and ../../ is
# ~/team-tavern, whose prod/ holds the data every release mounts.
#
# The rest comes from the .env in the release, which deploy.ps1 links to the
# server's own ~/team-tavern/.env. A build never carries one.

# The project is named here rather than after the directory compose runs from:
# every deploy runs from its own release directory, and they all have to be the
# same `teamtavern` project for `--remove-orphans` and the fixed container names
# to work.
name: teamtavern

# Every container is named as its service, so `docker` and `docker compose` take
# the same name, and the tt- prefix sets them apart from other containers on the
# machine.
services:
  tt-postgres:
    image: postgres:18.6
    container_name: tt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      # The data lives in <major>/docker below this, so the next major version
      # initializes beside it rather than over it.
      - ../../prod/docker-postgres/postgresql:/var/lib/postgresql
      - ../../prod/docker-postgres/backups:/backups

  tt-node:
    # Keep in step with the Volta pin in package.json.
    image: node:24.21.0
    container_name: tt-node
    restart: unless-stopped
    # Bash -c is necessary because of cd and &&, which are shell builtin commands.
    # --omit=dev: server.js bundles everything except bcrypt, pg and
    # @aws-sdk/client-sesv2, so the build toolchain has no place in this container.
    command: >
      bash -c "cd /root/team-tavern/server &&
              npm ci --omit=dev &&
              node server.js"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?}
      PGHOST: tt-postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      STEAM_API_KEY: ${STEAM_API_KEY:?}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?}
    volumes:
      - ./server:/root/team-tavern/server
      # Keeps the container's node_modules off the host.
      - node_modules:/root/team-tavern/server/node_modules
    depends_on:
      - tt-postgres

  tt-renderready:
    # No published image, so the first `up` builds it from the tag.
    build: https://github.com/lukapozega/renderready.git#v1.0.0
    container_name: tt-renderready
    restart: unless-stopped
    environment:
      # Without it, renderready fetches the page itself and hands it to Chromium, which then
      # treats the page as public and blocks its scripts from reaching the private `tt-caddy`
      # address. No render needs a redirect followed: every page path answers 200.
      FOLLOW_REDIRECTS: "true"
      # A render that never settles is a page that failed to load, not one to index half-drawn.
      TIMEOUT_STATUS_CODE: "503"
      # Matches subdomains too, so www and staging render.
      ALLOWED_DOMAINS: tt-caddy,teamtavern.net
    depends_on:
      - tt-node

  tt-caddy:
    image: caddy:2.11.4
    container_name: tt-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./base.Caddyfile:/etc/caddy/base.Caddyfile:ro
      - ./client:/srv:ro
      - ../../prod/docker-caddy/data:/data
      - ../../prod/docker-caddy/config:/config
    depends_on:
      - tt-node
      - tt-renderready

volumes:
  node_modules:

networks:
  default:
    # Without IPv6 on the network, Docker has no ip6tables rule for the
    # published ports, so docker-proxy relays an IPv6 client to Caddy over IPv4,
    # from the bridge's gateway. Every IPv6 client would then share one
    # X-Forwarded-For, and so one key in each limit kept per client address.
    # Changing this needs `docker compose down`: `up` does not recreate an
    # existing network.
    enable_ipv6: true
