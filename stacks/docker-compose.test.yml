# The test stack. It serves the client and server out of release/, the same
# files a server gets, and shares nothing else with the development stack: its
# database is a named volume seeded from src/TeamTavern/Database on first boot,
# and its Caddy listens on a shifted host port, so both stacks can run at once
# and `down -v` throws this one away without touching development data.
#
# A whole file rather than an override of docker-compose.release.yml because
# volumes merge across `-f` files instead of replacing: an override would mount
# the development Postgres host directory and the named volume on the same path.

name: teamtavern-test

# The services have the release's names, which base.Caddyfile addresses, but no
# container_name, since the release's containers already have theirs.
services:
  tt-postgres:
    image: postgres:18.6
    env_file: test.env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../src/TeamTavern/Database:/database:ro
      - ./test-seed:/test-seed:ro
      - ./test-seed/seed.sh:/docker-entrypoint-initdb.d/seed.sh:ro

  tt-node:
    # Keep in step with the Volta pin in package.json.
    image: node:24.21.0
    command: >
      bash -c "cd /root/team-tavern/server &&
              npm ci --omit=dev &&
              node server.js"
    env_file: test.env
    volumes:
      - ../release/server:/root/team-tavern/server
      - node_modules:/root/team-tavern/server/node_modules
    depends_on:
      - tt-postgres
      - tt-discord
      - tt-mail

  # Answers the Discord API the node container calls, at DISCORD_API_URL in test.env.
  tt-discord:
    # Keep in step with the Volta pin in package.json.
    image: node:24.21.0
    command: node /root/dist-test/discord-stub.js
    volumes:
      - ../dist-test:/root/dist-test:ro

  # Takes the mail the node container sends to SENDGRID_API_URL in test.env, and
  # shows it at /mail on Caddy's port.
  tt-mail:
    # Keep in step with the Volta pin in package.json.
    image: node:24.21.0
    command: node /root/dist-test/mail-stub.js
    volumes:
      - ../dist-test:/root/dist-test:ro

  tt-renderready:
    # No published image, so the first `up` builds it from the tag.
    build: https://github.com/lukapozega/renderready.git#v1.0.0
    environment:
      # Without it, renderready fetches the page itself and hands it to Chromium, which then
      # treats the page as public and blocks its scripts from reaching the private `tt-caddy`
      # address. No render needs a redirect followed: every page path answers 200.
      FOLLOW_REDIRECTS: "true"
      # A render that never settles is a page that failed to load, not one to index half-drawn.
      TIMEOUT_STATUS_CODE: "503"
      ALLOWED_DOMAINS: tt-caddy
    depends_on:
      - tt-node

  tt-caddy:
    image: caddy:2.11.4
    ports:
      - "${CADDY_HTTP_PORT:?set in stacks/test.env; pass --env-file stacks/test.env}:80"
    volumes:
      - ../release/caddy/base.Caddyfile:/etc/caddy/base.Caddyfile:ro
      - ./test.Caddyfile:/etc/caddy/Caddyfile:ro
      - ../release/client:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tt-node
      - tt-renderready

volumes:
  postgres_data:
  node_modules:
  caddy_data:
  caddy_config:
